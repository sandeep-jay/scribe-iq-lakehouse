[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-iq-lakehouse"
version = "0.1.0"
description = "Production-pattern healthcare data lakehouse on Synthea Coherent (Fabric medallion: Bronze -> Silver -> Gold)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandeep Jayaprakash" }]

dependencies = [
    "pyarrow>=15.0",
    "pydicom>=2.4",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Local lite tier (delta-rs mirror) — built in later sessions.
local = [
    "polars>=1.0",
    "deltalake>=0.18",
    "duckdb>=1.0",
    "watchdog>=4.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
    "jsonschema>=4.0",  # validates Gold corpus rows against the published contract
    "rich>=13.0",       # terminal rendering for scripts/demo_walkthrough.py
]
# Dagster orchestration tier (ADR-015/016) — third execution surface alongside the
# CLI and Fabric notebooks; imports the pure transforms, never imported by them.
orchestration = [
    "dagster>=1.8,<2.0",
    "dagster-webserver>=1.8,<2.0",
]

[tool.setuptools.packages.find]
# `core/` is the platform-agnostic kernel (shared by every platform tier).
# Each platform directory (`fabric/`, future `databricks/`, `aws/`) is a sibling
# package that depends on `core` one-way — `core` never imports from them.
# See docs/adr/017-multi-platform-repo-layout.md.
include = ["core*", "fabric*"]

[tool.dagster]
# `dagster dev` loads the medallion asset graph from this module (ADR-015/016).
module_name = "core.orchestration.dagster.definitions"

[tool.pytest.ini_options]
# Make `core` and `fabric` importable without an editable install. Tests live
# inside each domain so reorganising or removing a platform doesn't leave
# orphaned tests at the repo root.
pythonpath = ["."]
testpaths = ["core/tests", "fabric/tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]
# D203/D213 conflict with D211/D212 — pick the Google-style set.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests don't need module/function docstrings.
"core/tests/*" = ["D100", "D101", "D102", "D103", "D104"]
"fabric/tests/*" = ["D100", "D101", "D102", "D103", "D104"]

[tool.black]
line-length = 100
target-version = ["py311"]
