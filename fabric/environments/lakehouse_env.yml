# Fabric Environment spec — defines the Python runtime that backs the workspace
# notebooks. Built by `fabric/deploy/upload_wheel.py` on every push to main and
# referenced by every notebook's "Environment" setting.
#
# Stub. Session 5 fills in the real values and wires the upload helper.

name: scribe-iq-lakehouse-env
runtime: "1.3"   # Fabric Runtime version (Spark 3.5)

# Python packages installed into the environment. The core wheel is uploaded
# separately via Fabric REST API (`fabric/deploy/upload_wheel.py`) so it can
# be versioned per release.
python:
  packages:
    - pyarrow>=15.0
    - pydicom>=2.4
    - python-dateutil>=2.9
    - boto3>=1.34   # anonymous S3 client for the Synthea Coherent public bucket
                    # (used by notebook 01_bronze_ingest — no AWS account needed)

# Spark configuration overrides. Tuned for the medallion workload — small
# encounter-summary builds, mostly Delta MERGE on cohort partitions.
spark:
  pool: starter   # change to a custom pool for larger cohorts in production
  config:
    spark.sql.adaptive.enabled: "true"
    spark.databricks.delta.merge.repartitionBeforeWrite.enabled: "true"

# Wheel uploaded by `fabric/deploy/upload_wheel.py` after `python -m build core/`.
# Pinned per release tag.
custom_libraries:
  - name: scribe-iq-lakehouse-core
    type: wheel
    version: "${CORE_WHEEL_VERSION}"   # set by CI from the release tag
