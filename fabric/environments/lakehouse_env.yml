# Fabric Environment spec — documentation of the runtime that backs the workspace
# notebooks. The Fabric UI doesn't import this file as-is (use
# ``public_libraries.yml`` for the pip block + the Custom Libraries upload for
# the wheel); this one captures everything in one place for reviewers.
#
# Environment name: ``scribe-iq-lakehouse-env``.
# Referenced by every notebook's "Environment" dropdown.

name: scribe-iq-lakehouse-env
runtime: "1.3"   # Fabric Runtime version (Spark 3.5, Delta 3.x)

# Public libraries — pip-installable from PyPI, pinned for reproducibility.
# Import file: fabric/environments/public_libraries.yml
public_libraries:
  - boto3==1.35.36     # anonymous S3 client for the Synthea Coherent public bucket
  - botocore==1.35.36  # boto3's HTTP layer; pinned to the matching minor for safety

# Custom library — the project wheel built by ``python -m build --wheel``.
# Uploaded manually via Custom Libraries → Upload (or programmatically by
# ``fabric/deploy/upload_wheel.py`` once Service Principal is registered).
# Provides ``fabric.platform`` + ``fabric.transforms.*`` + ``fabric.gold.*`` +
# ``fabric.validation.*`` (and the un-used-on-Fabric ``core.*`` modules).
custom_libraries:
  - name: scribe-iq-lakehouse
    type: wheel
    artifact: dist/scribe_iq_lakehouse-0.1.0-py3-none-any.whl

# Spark configuration overrides. Tuned for the medallion workload — small-
# to-medium encounter-summary builds, mostly Delta MERGE on cohort partitions.
spark:
  pool: starter   # change to a custom pool for larger cohorts in production
  config:
    spark.sql.adaptive.enabled: "true"
    spark.databricks.delta.merge.repartitionBeforeWrite.enabled: "true"
