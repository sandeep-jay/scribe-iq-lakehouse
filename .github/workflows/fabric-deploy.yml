name: fabric deploy

# DISABLED auto-trigger — manual only (workflow_dispatch).
#
# Current deploy path uses Azure DevOps + Fabric Git Integration for notebooks
# and manual UI upload for the core wheel. The original GitHub-Actions-driven
# path here requires a Service Principal that we deferred; on the Fabric trial
# tenant we were on, GitHub Git Integration was blocked at the admin level so
# DevOps became the path. See fabric/docs/DEPLOYMENT.md "Why Azure DevOps."
#
# Keep this file for reference: if/when the Service Principal is registered
# and CI-driven deploys are wanted, change `on:` back to `push: branches: [main]`
# + register the FABRIC_* secrets in the fabric-prod GitHub Environment.
on:
  workflow_dispatch:

# Each deploy targets a single environment with its own secrets — see
# docs/adr/018-ci-cd-monorepo.md. Cross-platform secret leakage is prevented
# by GitHub Environment scoping.
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fabric-prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[local,dev,orchestration,fabric]"
          pip install build fabric-cicd

      - name: Run fabric contract tests
        run: pytest fabric/tests/ -v

      - name: Build core wheel
        run: python -m build --wheel --outdir dist/

      - name: Upload wheel to Fabric Environment
        # Uses MSAL Service Principal auth + Fabric REST v1 (ADR-018, ADR-019).
        env:
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
          FABRIC_ENVIRONMENT_ID: ${{ secrets.FABRIC_ENVIRONMENT_ID }}
        run: |
          python fabric/deploy/upload_wheel.py \
            --wheel "$(ls dist/scribe_iq_lakehouse*.whl | head -1)" \
            --environment-id "$FABRIC_ENVIRONMENT_ID"

      # Notebook sync is handled by Fabric Git Integration (workspace-side),
      # not by this workflow. See fabric/docs/DEPLOYMENT.md.

      - name: Smoke run notebook 05 (decoded SOAP note)
        # fabric-cicd triggers a one-shot run of the demo-centerpiece notebook;
        # smoke_notebook + timeout come from fabric/deploy/fabric_cicd_config.yml.
        env:
          FABRIC_TENANT_ID: ${{ secrets.FABRIC_TENANT_ID }}
          FABRIC_CLIENT_ID: ${{ secrets.FABRIC_CLIENT_ID }}
          FABRIC_CLIENT_SECRET: ${{ secrets.FABRIC_CLIENT_SECRET }}
          FABRIC_WORKSPACE_ID: ${{ secrets.FABRIC_WORKSPACE_ID }}
        working-directory: fabric/deploy
        run: |
          fabric-cicd deploy --config fabric_cicd_config.yml
          fabric-cicd smoke-run --config fabric_cicd_config.yml
