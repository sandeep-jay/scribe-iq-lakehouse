name: core build + publish wheel

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel
        run: python -m build --wheel --outdir dist/

      - name: List artifacts
        run: ls -la dist/

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: scribe-iq-lakehouse-core-wheel
          path: dist/*.whl
          retention-days: 30

      # On tagged releases, also attach the wheel to a GitHub Release. The release
      # itself is created via the GitHub UI or `gh release create` — this step
      # just uploads the artifact.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
